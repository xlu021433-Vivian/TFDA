name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:browser
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r waimai-helper/requirements.txt
      - run: python -m unittest discover -s tests -q
        working-directory: waimai-helper
