name: Release
# Merging a change of AssemblyFileVersion in desktop/Bootstrap.cs publishes that version:
# the EXE is built, passes the tests and the isolated WebView2 self-test, then becomes
# the latest GitHub release. Merges that keep an already released version do nothing.
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/release.yml', '.github/release-notes.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whether this version is already released
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = [regex]::Match((Get-Content desktop/Bootstrap.cs -Raw -Encoding utf8), 'AssemblyFileVersion\("(\d+\.\d+\.\d+)\.\d+"\)').Groups[1].Value
          if (-not $version) { throw 'No AssemblyFileVersion in desktop/Bootstrap.cs' }
          "version=$version" >> $env:GITHUB_OUTPUT
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { "skip=true" >> $env:GITHUB_OUTPUT; Write-Host "v$version is already released" } else { "skip=false" >> $env:GITHUB_OUTPUT }
          exit 0
      - uses: actions/setup-python@v5
        if: steps.version.outputs.skip == 'false'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: steps.version.outputs.skip == 'false'
        with:
          node-version: '24'
      - name: Fetch pinned Microsoft SDK
        if: steps.version.outputs.skip == 'false'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .tool-cache/webview2 -Force | Out-Null
          Invoke-WebRequest https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/1.0.4258.31/microsoft.web.webview2.1.0.4258.31.nupkg -OutFile .tool-cache/webview2/microsoft.web.webview2.1.0.4258.31.nupkg
      - if: steps.version.outputs.skip == 'false'
        run: npm ci
      - if: steps.version.outputs.skip == 'false'
        run: python desktop/build.py
      - if: steps.version.outputs.skip == 'false'
        run: node --test desktop/*.test.cjs
      - name: Real embedded browser with isolated merchant fixtures
        if: steps.version.outputs.skip == 'false'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $profile = Join-Path $env:RUNNER_TEMP ('shenqi-'+[guid]::NewGuid())
          $report = Join-Path $env:RUNNER_TEMP 'shenqi-result.json'
          $exe = (Resolve-Path dist/desktop-${{ steps.version.outputs.version }}/Shenqi-Desktop.exe).Path
          $job = Start-Process $exe -ArgumentList @('--self-test','--data-dir',('"'+$profile+'"'),'--report',('"'+$report+'"')) -WindowStyle Hidden -PassThru
          if (-not $job.WaitForExit(120000)) { $job.Kill(); throw 'Desktop verification timeout' }
          if (Test-Path $report) { Get-Content $report }
          if ($job.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'Desktop verification failed' }
      - name: Publish the verified EXE
        if: steps.version.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $folder = "dist/desktop-$env:VERSION"
          gh release create "v$env:VERSION" "$folder/Shenqi-Desktop.exe" "$folder/SHA256SUMS.txt" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Shenqi Desktop $env:VERSION" --notes-file .github/release-notes.md --latest
