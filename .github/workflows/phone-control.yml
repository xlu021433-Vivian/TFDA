name: Phone controller
on:
  push:
    paths: ['web/**', 'deploy/**', '.github/workflows/phone-control.yml']
  pull_request:
    paths: ['web/**', 'deploy/**', '.github/workflows/phone-control.yml']
permissions:
  contents: read
jobs:
  owner-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r web/requirements.txt
      - run: python -m unittest discover -s web -p 'test_*.py' -v
